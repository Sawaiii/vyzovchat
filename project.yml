name: VyzovChat
options:
  bundleIdPrefix: ru.vyzovchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # <- впишите свой Team ID из Apple Developer, если ставите на устройство
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  VyzovChat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VyzovChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.vyzovchat.app
        INFOPLIST_FILE: VyzovChat/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"          # только iPhone
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  # Снимает экраны приложения в симуляторе — из этих кадров собирается
  # презентация. В обычную сборку .ipa не входит: у него своя схема Screenshots.
  VyzovChatUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VyzovChatUITests
    dependencies:
      - target: VyzovChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.vyzovchat.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VyzovChat

schemes:
  VyzovChat:
    build:
      targets:
        VyzovChat: all
    run:
      config: Debug
    archive:
      config: Release

  Screenshots:
    build:
      targets:
        VyzovChat: all
        VyzovChatUITests: [test]
    test:
      config: Debug
      targets:
        - VyzovChatUITests
      # Экраны снимаем как есть, поэтому ни рандомизации порядка, ни повторов.
      randomExecutionOrder: false
